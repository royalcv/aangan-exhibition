[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for every route so deep links like /about work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes, so cache it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video posters keep stable names, so cache them for a week and let them revalidate.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
