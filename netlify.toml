[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Contact form handler (POST /api/contact). See netlify/functions/contact.mts.
[functions]
  directory = "netlify/functions"

# Every route is pre-rendered to its own HTML file (scripts/prerender.mjs), so there is no
# catch-all SPA redirect: /about serves about/index.html, and unknown URLs get dist/404.html with
# a real 404 status instead of a "200 OK" home page.

[[headers]]
  for = "/*"
  [headers.values]
    # Only this site's own scripts, styles, fonts, images and media; no framing; forms post only here.
    # 'unsafe-inline' for styles is needed by Motion and Radix, which set inline styles at runtime.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build output never changes, so cache it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
